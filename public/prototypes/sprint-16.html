<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aqlios Sprint 16 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --canvas:#EEF0F0;--paper:#fff;--line:#E6EAEA;--border:#DDE2E2;--well:#F4F6F6;--panel:#F7F8F8;
  --ink:#141B1A;--muted:#5B6766;--faint:#8A9493;--primary:#2C7A7B;--primary-dark:#1F5D5E;--accent:#E8F2F2;
  --brand:#5CE1E6;--brand-ink:#1E4E50;--brand-soft:#E9FBFC;--outline:#99A0AE;
  --success:#2E7D32;--success-soft:#EAF6EC;--info:#0288D1;--info-soft:#E6F4FB;--warn:#B26A00;--warn-soft:#FFF3E3;
  --error:#D32F2F;--error-soft:#FDECEA;--purple:#7B1FA2;--purple-soft:#F4E9F7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;flex-shrink:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- Prototype chrome (not part of the design) ---------- */
.chrome{position:sticky;top:0;z-index:50;background:#16201F;color:#fff;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:12px}
.chrome b.t{font-size:13px;font-weight:600;margin-right:4px}
.chrome .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chrome .lbl{color:#9FB0AE}
.chrome button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:4px 11px;font-size:12px}
.chrome button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.chrome select{background:#22302E;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;font-size:12px}
.chrome .clock{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px}
.chrome .sp{flex:1}

/* ---------- Staff CRM shell (matches the Aqlios CRM) ---------- */
.app{padding:14px;max-width:1560px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:28px;padding:10px 12px 10px 22px;margin-bottom:14px}
.top .crumbs{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumbs b{color:var(--ink);font-weight:600}
.top .search{flex:1;max-width:560px;margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--well);border-radius:999px;padding:10px 16px;color:var(--faint);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;flex-shrink:0}
.iconbtn .badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:999px;background:var(--error);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;flex-shrink:0}
.who .n{font-weight:600;font-size:13px;line-height:1.2}
.who .p{font-size:11px;color:var(--muted)}
.who .p i{font-style:normal;background:var(--success-soft);color:var(--success);border-radius:999px;padding:0 6px;margin-right:4px}
.av{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.av.sm{width:30px;height:30px;font-size:11px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.side{background:#fff;border:1px solid var(--border);border-radius:28px;padding:16px 12px;position:sticky;top:58px}
.side .logo{display:flex;align-items:center;gap:8px;padding:2px 8px 14px;font-weight:700;font-size:22px;letter-spacing:-.5px}
.side .logo small{font-weight:500;font-size:11px;line-height:1.2;color:var(--ink);border-left:1px solid var(--border);padding-left:8px;letter-spacing:0}
.side .sec{font-size:12px;color:var(--muted);padding:12px 10px 6px}
.side a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px;border:1.5px solid transparent}
.side a:hover{background:var(--well)}
.side a.on{border-color:var(--primary);font-weight:600}
.side a .cnt{margin-left:auto;background:var(--error);color:#fff;border-radius:999px;font-size:10px;font-weight:600;padding:1px 7px}
.side .me{display:flex;gap:10px;align-items:center;background:var(--well);border-radius:16px;padding:10px;margin-top:12px}
.side .me small{display:block;color:var(--muted);font-size:12px}
.main{background:#fff;border:1px solid var(--border);border-radius:28px;padding:22px 26px 30px;min-width:0;min-height:70vh}
.ptabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ptabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.ptabs button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.ptabs button .cnt{background:var(--error);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.3px}
.ph p{margin:2px 0 0;color:var(--muted);font-size:15px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sh{font-size:17px;font-weight:600;margin:22px 0 10px}

.card{background:#fff;border:1px solid var(--border);border-radius:18px}
.pad{padding:18px 20px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px 18px;margin-bottom:16px}
.filters .fl{display:flex;align-items:center;gap:6px;font-weight:500;align-self:center}
.sel{display:flex;flex-direction:column;gap:3px;min-width:150px}
.sel label{font-size:11px;color:var(--muted);padding-left:4px}
.sel select,.sel input{height:40px;border:1px solid rgba(0,0,0,.23);border-radius:12px;padding:0 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.kpi .ic{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center}
.kpi span.l{flex:1;font-weight:500}
.kpi b{font-size:28px;font-weight:600}
.kpi.o{background:#FFF4E8;color:#E65100}.kpi.b{background:#E8F3FC;color:#0277BD}.kpi.p{background:#F4EAF8;color:#8E24AA}.kpi.g{background:#EAF6EC;color:#2E7D32}.kpi.r{background:#FDECEC;color:#C62828}.kpi.t{background:var(--brand-soft);color:var(--primary-dark)}
.kpi span.l{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--outline);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn.sm{height:32px;padding:0 13px;font-size:12px}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{border-color:var(--success);color:var(--success)}
.btn.bad{border-color:var(--error);color:var(--error)}
.btn.danger{background:var(--error);border-color:var(--error);color:#fff}
.btn.ghost{border-color:transparent;color:var(--primary);padding:0 8px}
.btn:disabled{background:var(--well);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.ok{color:var(--success);border-color:#9CCC9F;background:var(--success-soft)}
.chip.info{color:var(--info);border-color:#8CC8EA;background:var(--info-soft)}
.chip.warn{color:var(--warn);border-color:#F0B456;background:var(--warn-soft)}
.chip.err{color:var(--error);border-color:#EF9A9A;background:var(--error-soft)}
.chip.grey{color:var(--muted);border-color:var(--border);background:var(--well)}
.chip.purple{color:var(--purple);border-color:#CE93D8;background:var(--purple-soft)}
.chip.brand{color:var(--brand-ink);border-color:var(--brand);background:var(--brand-soft)}
.chip svg{width:14px;height:14px}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:4px;white-space:nowrap}
.flag.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #F0B456}
.flag.err{background:var(--error-soft);color:var(--error);border:1px solid #EF9A9A}
.flag svg{width:13px;height:13px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px}
.alert.info{background:var(--info-soft);color:#01579B}.alert.warn{background:var(--warn-soft);color:#7A4300}.alert.err{background:var(--error-soft);color:#8C1D18}.alert.ok{background:var(--success-soft);color:#1B5E20}.alert.brand{background:var(--brand-soft);color:var(--brand-ink)}.alert.grey{background:var(--well);color:var(--muted)}
.alert b{display:block;margin-bottom:2px}
.alert .grow{flex:1}

.tbl{border:1px solid var(--border);border-radius:18px;overflow:auto;background:#fff}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;font-size:13px;padding:14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td small,.sub{color:var(--muted);font-size:12px;display:block}
td .lnk,.lnk{text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;text-align:left;font-size:inherit}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:flex-end;gap:18px;padding:12px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.item .grow{flex:1;min-width:180px}
.item b{font-weight:500}
.ic{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex-shrink:0}
.ic.err{background:var(--error-soft);color:var(--error)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.ok{background:var(--success-soft);color:var(--success)}.ic.grey{background:var(--well);color:var(--muted)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.timeline{display:grid;gap:10px;font-size:13px;border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.timeline div{position:relative}
.timeline div:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.timeline small{color:var(--muted);display:block}
.note{font-size:12px;color:var(--muted);border:1.5px dashed #A9CBCB;background:#FBFDFD;border-radius:12px;padding:10px 12px;margin-top:14px}
.note b{color:var(--ink)}
.oq{display:inline-flex;font-size:10px;font-weight:600;border-radius:999px;padding:1px 7px;background:#FFF3E0;color:#A85A00;border:1px solid #F5C77E;vertical-align:middle;margin-left:6px}

/* Forms, modals, drawers */
.form{display:grid;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f .req{color:var(--error)}
.f input,.f select,.f textarea{height:44px;border:1px solid rgba(0,0,0,.23);border-radius:12px;padding:0 12px;background:#fff;width:100%}
.f textarea{height:84px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.f .err{color:var(--error);font-size:12px}
.f .help{color:var(--muted);font-size:12px}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--error)}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff}
.choice:has(input:checked){border-color:var(--primary);background:var(--accent)}
.choice input{margin-top:4px;accent-color:var(--primary)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--primary);width:16px;height:16px}
.seg{display:inline-flex;padding:4px;gap:4px;border:1px solid var(--border);border-radius:999px;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--primary);color:#fff}
.switch{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:40px;height:22px;accent-color:var(--primary);flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(20,27,26,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:18px 22px 6px}
.modal .mh h3{margin:0;font-size:18px;font-weight:600}
.modal .mh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modal .mb{padding:12px 22px 6px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;flex-wrap:wrap}
.drawer-scrim{position:fixed;inset:0;background:rgba(20,27,26,.35);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:81;box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;padding:20px 22px 10px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:18px;font-weight:600}
.drawer .db{padding:16px 22px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sugg{border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sugg.top{border-color:var(--brand);background:var(--brand-soft)}
.sugg .grow{flex:1;min-width:160px}
.toast{position:fixed;left:18px;bottom:18px;z-index:90;background:#1F2A29;color:#fff;border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 36px)}
.toast.ok{background:#2E7D32}.toast.err{background:#C62828}
.dd{position:absolute;right:0;top:50px;width:380px;max-width:calc(100vw - 30px);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.16);padding:8px;z-index:60;max-height:70vh;overflow:auto}
.dd .n{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.dd .n:hover{background:var(--well)}
.dd .n.new{background:var(--brand-soft)}
.dd .n small{color:var(--muted);font-size:11px;display:block}

/* Rota */
.rota{display:grid;border:1px solid var(--border);border-radius:16px;overflow:auto;background:#fff}
.rota > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:84px;font-size:12px;display:flex;flex-direction:column;gap:5px}
.rota > .hd{min-height:auto;background:#FAFBFB;font-weight:600;padding:10px 8px;position:sticky;top:0}
.rota > .hd.wk{background:#FFF8E6;color:#8A4B00}
.rota > .hd small{display:block;font-weight:400;font-size:10.5px}
.rota .person{flex-direction:row;align-items:center;gap:8px;background:#FCFDFD}
.rota .person b{font-weight:500;font-size:12.5px;display:block}
.rota .cell{cursor:pointer}
.rota .cell:hover{background:#F6FBFB}
.rota .cell.today{background:#FBFEFE}
.rota .cell.wkend{background:#FFFCF4}
.shift{border-radius:8px;padding:5px 7px;border-left:3px solid var(--primary);background:var(--accent);display:grid;gap:2px;text-align:left;border-top:0;border-right:0;border-bottom:0;font-size:11.5px;width:100%}
.shift.loc{border-left-color:var(--purple);background:var(--purple-soft)}
.shift.open{border-left-color:var(--info);background:var(--info-soft);border:1px dashed #8CC8EA;border-left:3px solid var(--info)}
.shift.done{opacity:.6}
.shift.alarm{outline:2px solid var(--error);background:#FFF1F1}
.shift small{font-size:10.5px;color:var(--muted)}
.bt{white-space:nowrap;font-size:10px;font-weight:600;border-radius:999px;padding:0 6px;justify-self:start;display:inline-block}
.bt.s{background:var(--brand);color:var(--brand-ink)}.bt.h{background:#fff;border:1px solid var(--outline)}
.blocked{border-radius:8px;padding:6px 7px;background:repeating-linear-gradient(135deg,#F1F2F2,#F1F2F2 6px,#E7E9E9 6px,#E7E9E9 12px);color:var(--muted);font-size:11px;font-weight:500}

/* Patient web app */
.pweb{display:grid;grid-template-columns:240px minmax(0,1fr);background:#F7F9F9;border:1px solid var(--border);border-radius:24px;overflow:hidden;min-height:80vh}
.pweb .pside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.pweb .pside .logo{font-weight:700;font-size:22px;padding:0 10px 4px}
.pweb .pside .prac{font-size:12px;color:var(--muted);padding:0 10px 14px}
.pweb .pside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:14px}
.pweb .pside a:hover{background:var(--well)}
.pweb .pside a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.pweb .pside a .cnt{margin-left:auto;background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:10px;font-weight:700;padding:1px 7px}
.pweb .pside .sec{font-size:11px;color:var(--faint);padding:14px 12px 4px;letter-spacing:.04em}
.pweb .pmain{padding:24px 28px;min-width:0}
.pweb .ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pweb .ptop h1{margin:0;font-size:24px;font-weight:600}
.pweb .ptop p{margin:2px 0 0;color:var(--muted);font-size:14px}
.offer{border:1.5px solid var(--brand);background:#fff;border-radius:18px;padding:18px 20px;display:grid;gap:12px}
.month{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 4px;letter-spacing:.04em}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps span{height:6px;flex:1;min-width:40px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--brand)}

.hide-sm{}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .side nav{display:flex;flex-wrap:wrap;gap:4px}
  .side .sec,.side .me,.side .logo{display:none}
  .side a{padding:7px 12px;font-size:13px;border-color:var(--line)}
  .pweb{grid-template-columns:1fr}
  .pweb .pside{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}
  .pweb .pside .logo,.pweb .pside .prac,.pweb .pside .sec{display:none}
  .pweb .pside a{padding:7px 10px;font-size:13px}
  .top .search{display:none}
  .top .crumbs{flex:1}
}

      o.state = 'expired';

    });
    if (['needs', 'offered', 'open_all', 'pending_pm'].includes(sl.status) && S.now >= sl.start) {
      sl.offers.filter(o => o.state === 'open').forEach(o => { o.state = 'expired'; const w = S.waitlist.find(w => w.pid === o.pid && w.status === 'offered'); if (w) w.status = 'waiting'; });
      sl.status = 'closed'; sl.history.push({ at: sl.start, text: 'Appointment time passed without the slot being filled.' });
    }

  // locum direct offers expire
  S.shifts.filter(x => x.status === 'offered' && x.offer && x.offer.state === 'offered' && S.now >= x.offer.expires).forEach(x => {
    x.offer.state = 'expired'; x.status = 'unfilled';

    notify('locum', 'Offer expired', `The offer for ${fDay(x.start)} ${fT(x.start)} has expired.`, 'myrota/offers');
  });
  // bidding closes: nothing automatic, manager decides
  // booked shifts finish → completed + activity line
  S.shifts.filter(x => x.status === 'booked' && S.now >= x.end).forEach(x => {
    x.status = 'completed';
    const st = ST(x.staffId);
    if (st.type === 'locum' && !S.activity.some(a => a.shiftId === x.id)) {
      const rate = (st.rates || []).find(r => r.duty === x.duty) || { hourly: 0, session: 0 };
      const hours = x.booking === 'session' ? SESSION_MIN / 60 : hrs(x.end - x.start);
      S.activity.unshift({ id: nid('ac'), shiftId: x.id, staffId: st.id, label: `${fDay(x.start)} · ${x.duty} · ${PRACTICES[x.practice]}`, practice: x.practice, booking: x.booking, planned: [x.start, x.end], actual: [x.start + 3 * MIN, x.end - 2 * MIN], appts: [12, 11, 1], rate: x.booking === 'session' ? rate.session : rate.hourly, hours, amount: x.booking === 'session' ? rate.session : Math.round(rate.hourly * hours * 100) / 100, flags: [], status: 'pending', notes: [] });
      notify('ops', 'New activity to validate', `${st.name} · ${fDay(x.start)} ${x.duty}`, 'validation');
    }
  });
  // appointments in the past are completed
  S.appts.filter(a => a.status === 'booked' && S.now > a.start + 30 * MIN).forEach(a => { a.status = 'completed'; });
}

/* ================= Rota, locums, validation ================= */
const WEEK0 = at(-2, '00:00'); // Mon 16/11/2026
const weekStart = () => WEEK0 + (U.week || 0) * 7 * DAY;
const isLocum = id => ST(id).type === 'locum';
function compStatus(k) { if (k.status === 'pending') return 'pending'; if (k.expiry && k.expiry < S.now) return 'expired'; return k.status; }
function gaps(staffId) { const st = ST(staffId); return (st.compliance || []).filter(k => compStatus(k) !== 'verified'); }
function blockedBy(staffId, s, e) {
  const lv = S.leave.find(l => l.staffId === staffId && overlap(s, e, l.from, l.to));
  if (lv) return `${ST(staffId).name} is on ${lv.kind.toLowerCase()} at this time and can’t be assigned.`;
  const un = S.unavail.find(u => u.staffId === staffId && ['saved', 'approved'].includes(u.status) && overlap(s, e, u.start, u.end));
  if (un) return `${ST(staffId).name} is unavailable at this time.`;
  return '';
}
function clash(staffId, s, e, except) { return S.shifts.find(x => x.id !== except && x.staffId === staffId && ['booked', 'completed'].includes(x.status) && overlap(s, e, x.start, x.end)); }
const rateFor = (staffId, duty) => (ST(staffId).rates || []).find(r => r.duty === duty);
function eligible(staffId, x) {
  const st = ST(staffId);
  if (!(st.linked || []).includes(x.practice)) return [false, `Not linked to ${PRACTICES[x.practice]}`];
  if (!rateFor(staffId, x.duty)) return [false, `No rate set for ${x.duty}`];
  if (x.visibleTo === 'named' && !(x.named || []).includes(staffId)) return [false, 'Offered to named locums only'];
  if (clash(staffId, x.start, x.end)) return [false, 'Clashes with one of your shifts'];
  if (blockedBy(staffId, x.start, x.end)) return [false, 'You’re unavailable at this time'];
  return [true, ''];
}
const bookChip = x => `<span class="bt ${x.booking === 'session' ? 's' : 'h'}" title="${x.booking === 'session' ? 'Session: 4 h 10 m from the start time' : 'Hourly: start and end set by the manager'}">${x.booking === 'session' ? 'Session' : 'Hourly'}</span>`;
const shiftTxt = x => `${fDay(x.start)} · ${fT(x.start)}–${fT(x.end)} · ${x.duty} · ${PRACTICES[x.practice]}`;

PAGES.rota = parts => {

  const bids = S.shifts.filter(x => x.status === 'open' && x.bids.some(b => b.state === 'placed')).length;

  const items = window.NO_LOCUM ? [['grid', 'Rota']] : [['grid', 'Rota'], ['bidding', 'Shift Bidding', bids]];
  if (U.role === 'pm' && !window.NO_LOCUM) items.push(['requests', 'Unavailability Requests', reqs]);
  return tabs(items, t, 'rota') + ({ grid: rotaGrid, bidding: rotaBidding, requests: rotaRequests }[t] || rotaGrid)();
};
function rotaGrid() {
  const view = U.filt.rv || 'all'; const ws = weekStart();

ACT.assign = d => {

function complianceTable(id, manager) {

  return `${g.length ? `<div class="alert err" style="margin-bottom:14px">${I.alert}<div><b>${manager ? 'This locum can’t bid or accept shifts' : 'You can’t bid or accept shifts yet'}</b>${g.map(k => `${esc(k.name)}: ${lab[compStatus(k)].toLowerCase()}`).join(' · ')}</div></div>` : `<div class="alert ok" style="margin-bottom:14px">${I.check}<div><b>All mandatory items are verified</b>${manager ? 'This locum can bid and accept shifts.' : 'You can bid for and accept shifts.'}</div></div>`}

}

  const rows = S.activity.filter(a => a.status !== 'paid').sort((a, b) => a.staffId.localeCompare(b.staffId) || a.planned[0] - b.planned[0]).map(a => `<tr><td>${esc(ST(a.staffId).name)}</td><td>${esc(a.label)}<br>${bookChip(a)}</td><td>${fT(a.planned[0])}–${fT(a.planned[1])}<small>Actual ${fT(a.actual[0])}–${fT(a.actual[1])}</small></td><td>${a.appts[0]} / ${a.appts[1]} / ${a.appts[2]}<small>booked / done / DNA</small></td><td>${a.flags.map(f => chip('warn', f)).join(' ') || '<span class="sub">None</span>'}</td><td>${a.adjusted || (a.booking === 'session' ? '4 h 10 m' : hrs(a.hours * HOUR) + ' h')}<small>${money(a.amount)}</small></td><td>${chip(...actTone[a.status])}${a.notes.map(n => `<small>Locum: ${esc(n)}</small>`).join('')}</td><td>${a.status === 'pending' ? `<div class="row"><button class="btn sm ok" data-act="approveLine" data-id="${a.id}">Approve</button><button class="btn sm bad" data-act="modal" data-m="disapprove" data-id="${a.id}">Disapprove</button><button class="btn sm" data-act="modal" data-m="adjust" data-id="${a.id}">Adjust Hours</button></div>` : a.status === 'sent' ? '<span class="sub">Locked</span>' : ''}</td></tr>`);
  return ph('Workforce Validation', 'Locum activity for the pay period 16/11/2026 – 22/11/2026, by practice and Hub. Approved lines are locked and sent to Finance.') + `<div class="kpis">${kpi('o', 'clock', 'To Validate', S.activity.filter(a => a.status === 'pending').length)}${kpi('r', 'alert', 'Flagged', S.activity.filter(a => a.status === 'pending' && a.flags.length).length)}${kpi('b', 'money', 'Sent To Finance', S.activity.filter(a => a.status === 'sent').length)}</div>` + table(['Locum', 'Shift', 'Planned', 'Appointments', 'Flags', 'Hours', 'Status', 'Actions'], rows, 'Nothing to validate.') + note(`Weekly or monthly period? ${oq('D6')} Hourly shifts paid on planned or actual hours? ${oq('D3')}`);
};
ACT.approveLine = d => { const a = S.activity.find(x => x.id === d.id); a.status = 'sent'; if (a.staffId === 's-mf') notify('locum', 'Activity approved', `${a.label} was approved and sent to Finance.`, 'earnings'); toast('Approved and sent to Finance'); };
MODALS.disapprove = id => modal('Disapprove', S.activity.find(x => x.id === id).label, field('dpR', 'Reason', '<textarea id="dpR" maxlength="250" placeholder="e.g. Finished 50 minutes early with no appointments completed"></textarea>', { req: true, err: U.err }), `<button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="disapprove" data-id="${id}">Disapprove</button>`);
ACT.disapprove = d => { if (!val('dpR')) { U.err = 'Reason is required'; return; } const a = S.activity.find(x => x.id === d.id); a.status = 'disapproved'; a.reason = val('dpR'); if (a.staffId === 's-mf') notify('locum', 'Activity disapproved', `${a.label}: ${a.reason}`, 'activity'); U.modal = null; toast('Disapproved. The locum can reply once.'); };
MODALS.adjust = id => { const a = S.activity.find(x => x.id === id); return modal('Adjust Hours', a.label, `<div class="form">${field('adH', 'Hours to pay', `<input id="adH" inputmode="decimal" value="${hrs(a.hours * HOUR)}">`, { req: true, help: 'The original hours are kept.' })}${field('adR', 'Reason', '<textarea id="adR" maxlength="250"></textarea>', { req: true })}${U.err ? `<div class="alert err">${I.alert}<div>${esc(U.err)}</div></div>` : ''}</div>`, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn brand" data-act="adjust" data-id="${id}">Save</button>`); };
ACT.adjust = d => { const h = Number(val('adH')); if (!(h > 0) || !val('adR')) { U.err = !(h > 0) ? 'Enter the hours, e.g. 3.5' : 'Reason is required'; return; } const a = S.activity.find(x => x.id === d.id); const st = ST(a.staffId); const r = (st.rates || []).find(r => a.label.includes(r.duty)) || { hourly: a.rate }; a.adjusted = `${h} h`; a.amount = Math.round(h * r.hourly * 100) / 100; a.flags = [...a.flags, `Adjusted: ${val('adR')}`]; U.modal = null; toast('Hours adjusted. Approve the line to send it to Finance.'); };

/* ================= Patient web app ================= */
const PP = {};
const PNAV = [['Home', 'home', 'grid'], ['Appointments', 'appts', 'cal'], ['Get Help', 'help', 'msg'], ['Test Results', 'results', 'drop'], ['MY PROFILE'], ['My Health', 'health', 'heart'], ['Vaccinations', 'vacc', 'syringe'], ['Request a Letter', 'letters', 'doc'], ['Notifications', 'notifications', 'bell']];
function myOffers(pid) { return S.slots.flatMap(sl => sl.offers.filter(o => o.pid === pid).map(o => ({ sl, o }))); }
function patientShell(content) {
  const pid = U.pid; const r = route().split('/')[0];
  const cnt = { appts: myOffers(pid).filter(x => x.o.state === 'open').length, results: S.results.filter(x => x.pid === pid && x.status === 'released' && !x.seen).length, notifications: myNotifs().filter(n => !n.read).length };
  return `<div class="app"><div class="pweb"><nav class="pside" aria-label="Main navigation"><div class="logo">aqlios</div><div class="prac">Ashford Medical Centre</div>${PNAV.map(([l, k, i]) => !k ? `<div class="sec">${l}</div>` : `<a href="#" data-act="go" data-r="${k}" class="${r === k ? 'on' : ''}" ${r === k ? 'aria-current="page"' : ''}>${I[i]}${l}${cnt[k] ? `<span class="cnt">${cnt[k]}</span>` : ''}</a>`).join('')}</nav><main class="pmain">${content}</main></div></div>`;
}
const ptop = (t, sub, acts = '') => `<div class="ptop"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${acts}</div>`;

PP.home = () => {
  const pid = U.pid; const p = P(pid);
  const next = S.appts.filter(a => a.pid === pid && a.status === 'booked').sort((a, b) => a.start - b.start)[0];
  const offers = myOffers(pid).filter(x => x.o.state === 'open');
  const hv = S.homeVisits.filter(h => h.pid === pid && h.status === 'Booked');
  return ptop(`Hello, ${esc(p.name.split(' ')[0])}`, 'Ashford Medical Centre') + offers.map(({ sl, o }) => offerCard(sl, o)).join('') +
    `<div class="grid2" style="margin-top:14px"><div class="card pad"><b>Next appointment</b>${next ? `<p style="margin:8px 0 2px;font-size:16px;font-weight:600">${fLong(next.start)}</p><div class="sub">${esc(ST(next.clin).name)} · ${esc(next.mode)} · ${esc(next.problem)}</div><button class="btn sm" style="margin-top:10px" data-act="go" data-r="appts">View Appointments</button>` : '<p class="sub">No upcoming appointments.</p>'}</div>
    <div class="card pad"><b>Quick links</b><div class="list" style="margin-top:8px">${[['Get help with a health problem', 'help'], ['Test results', 'results'], ['Request a letter', 'letters']].map(([l, k]) => `<button class="item" style="cursor:pointer;text-align:left" data-act="go" data-r="${k}"><span class="grow">${l}</span>${I.chev}</button>`).join('')}</div></div></div>
    ${hv.map(h => `<div class="alert ok" style="margin-top:14px">${I.home}<div><b>Home visit booked</b>${esc(ST(h.clin).name)} will visit on ${fD(h.date)}, ${esc(h.window)}.</div></div>`).join('')}`;
};
function offerCard(sl, o) {
  const held = o.holdUntil;
  return `<div class="offer" style="margin-bottom:12px"><div class="row"><span class="ic">${I.cal}</span><div style="flex:1;min-width:200px"><b style="font-size:16px;font-weight:600">An earlier appointment is available</b><div class="sub" style="font-size:13px">${fLong(sl.start)} · ${esc(ST(sl.clin).name)} · ${esc(sl.mode)}</div></div>${held ? chip('info', `Held for you until ${fT(held)} (${dur(held - S.now)} left)`) : chip('purple', 'First to accept')}</div>
  <div class="sub" style="font-size:13px">${held ? 'You’re on the waiting list. If you accept, this replaces your place on the waiting list.' : 'This appointment is offered to several patients. The first to accept gets it.'}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="declineOffer" data-id="${sl.id}">Decline</button><button class="btn brand" data-act="acceptSlot" data-id="${sl.id}">Accept Appointment</button></div></div>`;
}
PP.appts = () => {
  const pid = U.pid;
  const up = S.appts.filter(a => a.pid === pid && a.status === 'booked').sort((a, b) => a.start - b.start);
  const past = S.appts.filter(a => a.pid === pid && a.status !== 'booked').sort((a, b) => b.start - a.start);
  const offers = myOffers(pid);
  const w = S.waitlist.find(w => w.pid === pid && w.status !== 'booked');
  const hv = S.homeVisits.filter(h => h.pid === pid);
  const res = offers.filter(x => x.o.state !== 'open' && S.now - (x.o.at || 0) < 3 * DAY).map(({ sl, o }) => {
    const m = { accepted: ['ok', 'Accepted', `Your appointment is booked for ${fLong(sl.start)}. You’ve been taken off the waiting list.`], declined: ['grey', 'Declined', 'You declined this appointment. You’re still on the waiting list.'], expired: ['warn', 'Offer expired', 'This appointment is no longer held for you. You’re still on the waiting list.'], taken: ['err', 'Already taken', 'Sorry, someone else accepted this appointment first.'] }[o.state];
    return m ? `<div class="alert ${m[0]}" style="margin-bottom:10px">${I.info}<div><b>${m[1]} · ${fLong(sl.start)}</b>${m[2]}</div></div>` : '';
  }).join('');
  return ptop('Appointments', 'Your appointments at Ashford Medical Centre') + offers.filter(x => x.o.state === 'open').map(({ sl, o }) => offerCard(sl, o)).join('') + res +
    `<h2 class="sh">Upcoming</h2><div class="list">${up.map(a => { const lt24 = a.start - S.now < 24 * HOUR; return `<div class="item"><span class="ic ${lt24 ? 'warn' : ''}">${I.cal}</span><div class="grow"><b>${fLong(a.start)}</b><div class="sub">${esc(ST(a.clin).name)} · ${esc(a.mode)} · ${esc(a.problem)}</div>${lt24 ? `<div style="color:#7A4300;font-size:12px;margin-top:4px">This appointment is less than 24 hours away. To cancel, call Ashford Medical Centre on 01233 555 010.</div>` : ''}</div>${lt24 ? `<a class="btn sm brand" href="tel:01233555010">${I.phone} Call</a><button class="btn sm" disabled>Cancel</button>` : `<button class="btn sm bad" data-act="modal" data-m="pCancel" data-id="${a.id}">Cancel</button>`}</div>`; }).join('') || '<div class="empty">No upcoming appointments.</div>'}
    ${hv.filter(h => h.status === 'Booked').map(h => `<div class="item"><span class="ic">${I.home}</span><div class="grow"><b>Home visit · ${fD(h.date)}</b><div class="sub">${esc(ST(h.clin).name)} · ${esc(h.window)}</div></div>${chip('ok', 'Booked')}</div>`).join('')}</div>
    ${w ? `<h2 class="sh">Waiting list</h2><div class="item"><span class="ic grey">${I.clock}</span><div class="grow"><b>Routine · ${w.window === '1w' ? 'within 1 week' : 'within 2 weeks'}</b><div class="sub">${esc(w.reason)} · added ${fD(w.added)}</div></div>${w.status === 'offered' ? chip('brand', 'Offer available') : chip('grey', 'Waiting')}</div>` : ''}
    <h2 class="sh">Past and cancelled</h2><div class="list">${past.map(a => `<div class="item"><span class="ic grey">${I.cal}</span><div class="grow"><b>${fLong(a.start)}</b><div class="sub">${esc(ST(a.clin).name)} · ${esc(a.problem)}</div></div>${a.status === 'cancelled' ? chip('grey', 'Cancelled') : chip('ok', 'Completed')}</div>`).join('') || '<div class="sub">None.</div>'}</div>`;
};
MODALS.pCancel = id => { const a = A(id); return modal('Cancel Appointment?', `${fLong(a.start)} with ${ST(a.clin).name}`, `<div class="form"><div class="f"><label for="pcR">Reason (optional)</label><textarea id="pcR" maxlength="250" data-counter="pcC"></textarea><span class="help" id="pcC" style="text-align:right">0 / 250</span></div><div class="alert info">${I.info}<div>Your slot will be offered to another patient who is waiting.</div></div></div>`, `<button class="btn" data-act="closeModal">Keep Appointment</button><button class="btn danger" data-act="pCancel" data-id="${id}">Cancel Appointment</button>`); };
ACT.pCancel = d => { const a = A(d.id); if (a.start - S.now < 24 * HOUR) { toast('This appointment can no longer be cancelled in the app. Please call the practice.', 'err'); U.modal = null; return; } if (val('pcR').length > 250) { U.err = 'Reason must be 250 characters or fewer'; return; } cancelAppt(a, val('pcR'), 'patient', 'app'); U.modal = null; toast('Appointment cancelled'); };
ACT.acceptSlot = d => {
  const sl = S.slots.find(s => s.id === d.id); const o = sl.offers.find(o => o.pid === U.pid && o.state === 'open');
  if (!o || !['offered', 'open_all'].includes(sl.status)) { toast('Sorry, this appointment is no longer available.', 'err'); return; }
  o.state = 'accepted'; bookSlot(sl, U.pid, `${P(U.pid).name} accepted the offer. Appointment booked.`);
  notify('cn', 'Offer accepted', `${P(U.pid).name} accepted ${fLong(sl.start)}.`, 'appt/cancelled'); toast('Appointment booked');
};
ACT.declineOffer = d => {
  const sl = S.slots.find(s => s.id === d.id); const o = sl.offers.find(o => o.pid === U.pid && o.state === 'open'); if (!o) return;
  o.state = 'declined'; const w = S.waitlist.find(w => w.pid === U.pid && w.status === 'offered'); if (w) w.status = 'waiting';
  sl.history.push({ at: S.now, text: `${P(U.pid).name} declined.` });
  if (sl.status === 'offered' || !sl.offers.some(x => x.state === 'open')) sl.status = 'needs';
  notify('cn', 'Offer declined', `${P(U.pid).name} declined ${fLong(sl.start)}. Offer it to the next patient.`, 'appt/cancelled'); toast('Declined. You’re still on the waiting list.');
};

/* ---------- Get help: pathway with the home visit question ---------- */
const HV_RULES = [
  ['A child who is feverish or unwell', 'Bring them to the surgery. If you think they’re too unwell to travel, call 999.'],
  ['A cough, sore throat, flu, back pain or feeling generally unwell', 'Book a normal appointment or speak to a pharmacist.'],
  ['Transport, childcare or mobility, when you can get to other services', 'Book a normal appointment. Ask us about transport help.'],
  ['A leg ulcer or pressure sore already seen by the district nurse', 'Contact your district nurse first.'],
];
PP.help = () => {
  const g = U.gh || (U.gh = { step: 1, who: 'me', problem: 'Breathlessness', hv: '', none: false, reason: '', text: '' });
  const p = P(U.pid); const dep = p.dependant; const forName = g.who === 'dep' && dep ? dep.name.split(' ')[0] : 'you';
  const steps = `<div class="steps">${[1, 2, 3, 4].map(i => `<span class="${i <= g.step ? 'on' : ''}"></span>`).join('')}</div>`;
  const emerg = `<div class="alert err">${I.alert}<div><b>Severe chest pain or another emergency? Call 999 now.</b>Don’t use this form.</div></div>`;
  let body = '';
  if (g.step === 1) body = `<h3 style="margin:0">Who is this request for?</h3><label class="choice"><input type="radio" name="ghW" value="me" ${g.who === 'me' ? 'checked' : ''}><div><b style="font-weight:500">Myself</b><div class="sub">${esc(p.name)}</div></div></label>${dep ? `<label class="choice"><input type="radio" name="ghW" value="dep" ${g.who === 'dep' ? 'checked' : ''}><div><b style="font-weight:500">${esc(dep.name)}</b><div class="sub">${esc(dep.age)}</div></div></label>` : ''}
    ${field('ghP', 'What do you need help with?', `<select id="ghP">${['Breathlessness', 'Fever or high temperature', 'Back pain', 'Cough or cold', 'Fall at home', 'Something else'].map(x => `<option ${x === g.problem ? 'selected' : ''}>${x}</option>`).join('')}</select>`, { req: true })}`;
  if (g.step === 2) {
    const preg = S.settings.pregnancyInfantRule && g.who === 'dep' && dep && dep.infant;
    body = `${emerg}<h3 style="margin:0">Do you need a home visit?</h3>
    <label class="choice"><input type="radio" name="ghH" value="no" ${g.hv === 'no' ? 'checked' : ''} data-act="ghHv"><div><b style="font-weight:500">No, I can come to the practice</b><div class="sub">Or have a phone or video appointment.</div></div></label>
    <label class="choice"><input type="radio" name="ghH" value="yes" ${g.hv === 'yes' ? 'checked' : ''} data-act="ghHv"><div><b style="font-weight:500">Yes, ${g.who === 'dep' ? `${esc(forName)} can’t leave home` : 'I can’t leave home'}</b><div class="sub">For example, housebound or too ill to travel.</div></div></label>
    ${g.hv === 'yes' ? `${preg ? `<div class="alert warn">${I.alert}<div><b>Home visits aren’t available for infants under 1 year</b>Please bring ${esc(forName)} to the surgery, or call 999 if they’re too unwell to travel. ${oq('Rule waiting for Jalil / Burhan')}</div></div>` : ''}<div><b>Home visits usually aren’t possible for:</b><div class="list" style="margin-top:8px">${HV_RULES.map(([a, b]) => `<div class="item" style="padding:10px 14px"><div class="grow"><b>${a}</b><div class="sub">${b}</div></div></div>`).join('')}</div></div><label class="check"><input type="checkbox" id="ghNone" ${g.none ? 'checked' : ''}> <span>None of these apply${g.who === 'dep' ? ` to ${esc(forName)}` : ' to me'}.</span></label>` : ''}${U.err ? `<div class="alert err">${I.alert}<div>${esc(U.err)}</div></div>` : ''}`;
  }
  if (g.step === 3 && g.hv === 'yes') {
    const opts = ['Can’t leave home (housebound)', 'Too ill to travel', ...(g.who === 'dep' ? ['Has a fever or is unwell (child)'] : []), 'Other'];
    const blocked = g.reason === 'Has a fever or is unwell (child)';
    body = `<h3 style="margin:0">Why ${g.who === 'dep' ? `does ${esc(forName)}` : 'do you'} need a home visit?</h3>${opts.map(o => `<label class="choice"><input type="radio" name="ghR" value="${esc(o)}" ${g.reason === o ? 'checked' : ''} data-act="ghReason"><div>${esc(o)}</div></label>`).join('')}
    ${blocked ? `<div class="alert warn">${I.alert}<div><b>Please bring ${esc(forName)} to the surgery</b>Children with a fever are usually best seen at the surgery, where we can examine them properly. If you think ${esc(forName)} is too unwell to travel, call 999.</div></div>` : ''}${U.err ? `<div class="alert err">${I.alert}<div>${esc(U.err)}</div></div>` : ''}`;
  }
  if (g.step === 3 && g.hv !== 'yes') g.step = 4;
  if (g.step === 4) body = `<h3 style="margin:0">Tell us more</h3>${field('ghT', 'What’s happening, and since when?', `<textarea id="ghT" maxlength="1000">${esc(g.text)}</textarea>`, { req: true, err: U.err })}<div class="alert grey">${I.info}<div>Home visit required: <b style="display:inline">${g.hv === 'yes' ? 'Yes' : 'No'}</b>${g.reason ? ` · ${esc(g.reason)}` : ''}</div></div>`;
  if (g.step === 5) body = `<div class="alert ok">${I.check}<div><b>Request sent</b>The practice replies within 48 hours.${g.hv === 'yes' ? ' They’ll contact you to arrange the home visit.' : ''}</div></div><button class="btn" data-act="ghReset">Start Another Request</button>`;
  const blockedNow = g.step === 3 && g.reason === 'Has a fever or is unwell (child)';
  const foot = g.step < 5 ? `<div class="row" style="justify-content:flex-end">${g.step > 1 ? `<button class="btn" data-act="ghBack">Back</button>` : ''}${blockedNow ? `<button class="btn brand" data-act="ghSurgery">Book at the Surgery Instead</button>` : `<button class="btn brand" data-act="ghNext">${g.step === 4 ? 'Send Request' : 'Continue'}</button>`}</div>` : '';
  return ptop('Get help with a health problem', g.step < 5 ? `Step ${Math.min(g.step, 4)} of 4${g.who === 'dep' && dep ? ` · For ${esc(dep.name)} (${esc(dep.age)})` : ''}` : '') + `<div class="card pad" style="max-width:780px;display:grid;gap:14px">${g.step < 5 ? steps : ''}${body}${foot}</div>` + (g.step === 2 ? note(`Pregnancy and under-1 warning is ${S.settings.pregnancyInfantRule ? 'on' : 'off'} (Practice Settings). ${oq('Waiting for Jalil / Burhan')}`) : '');
};
ACT.ghHv = () => { U.gh.hv = radio('ghH'); U.gh.none = false; U.err = null; };
ACT.ghReason = () => { U.gh.reason = radio('ghR'); U.err = null; };
ACT.ghBack = () => { const g = U.gh; g.step = g.step === 4 && g.hv !== 'yes' ? 2 : g.step - 1; U.err = null; };
ACT.ghReset = () => { U.gh = null; };
ACT.ghSurgery = () => { U.gh = null; go('appts'); toast('We’ll help you book at the surgery. Call 01233 555 010 or choose a slot.'); return 'noRender'; };
ACT.ghNext = () => {
  const g = U.gh; U.err = null;
  if (g.step === 1) { g.who = radio('ghW') || 'me'; g.problem = val('ghP'); g.step = 2; return; }
  if (g.step === 2) { if (!g.hv) { U.err = 'Choose an answer'; return; } if (g.hv === 'yes' && !val('ghNone')) { U.err = 'Confirm none of these apply, or choose “No, I can come to the practice”.'; return; } g.none = true; g.step = g.hv === 'yes' ? 3 : 4; return; }
  if (g.step === 3) { if (!g.reason) { U.err = 'Choose a reason'; return; } g.step = 4; return; }
  if (g.step === 4) {
    g.text = val('ghT'); if (!g.text) { U.err = 'Tell us what’s happening'; return; }
    const dep = P(U.pid).dependant;
    S.consults.unshift({ id: nid('c'), pid: U.pid, problem: g.problem, submitted: S.now, urgency: 'Routine', homeVisit: g.hv === 'yes', hvReason: g.reason, text: g.text, status: 'Review Needed', hvId: null, forWho: g.who === 'dep' && dep ? `${dep.name} (${dep.age})` : '' });
    if (g.hv === 'yes') { notify('gp', 'Home visit requested', `${P(U.pid).name}: ${g.problem}. ${g.reason}.`, 'consults'); notify('cn', 'Home visit requested', `${P(U.pid).name}: ${g.problem}.`, 'consults'); }
    g.step = 5; toast('Request sent');
  }
};

/* ---------- Test results ---------- */
PP.results = parts => {
  if (parts[1]) return resultDetail(parts[1]);
  const pid = U.pid; const f = U.filt.rf || 'year'; const yr = Number(U.filt.ry || 2026); const mo = U.filt.rm || '2026-11';
  const list = S.results.filter(r => r.pid === pid && ['released', 'pending', 'awaiting'].includes(r.status)).filter(r => { const d = new Date(r.taken); return f === 'year' ? d.getFullYear() === yr : `${d.getFullYear()}-${pad(d.getMonth() + 1)}` === mo; }).sort((a, b) => b.taken - a.taken);
  const groups = {}; list.forEach(r => { const k = new Date(r.taken).toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase(); (groups[k] = groups[k] || []).push(r); });
  const oc = r => r.status !== 'released' ? chip('grey', 'Pending', 'clock') : r.outcome === 'normal' ? chip('ok', 'Normal') : r.outcome === 'borderline' ? chip('warn', 'Borderline') : chip('err', 'Needs follow-up');
  return ptop('Test Results', 'Results appear here once your GP has reviewed and released them.') +

    ['GP: Amelia’s profile → Awaiting Review → Add to Record or Dismiss', 'gp', 'patient/p7', null, () => S.health.concat(S.vaccs).some(h => h.reviewedBy)]] },
  { t: 'Request a letter', d: 'Patient request → admin queue → ready to download.', steps: [
    ['Amelia requests a Fit to fly letter', 'patient', 'letters', 'p7', () => S.letters.some(l => l.pid === 'p7')],
    ['Care navigator: Letter Requests → Start → Mark Ready', 'cn', 'letters', null, () => S.letters.some(l => l.pid === 'p7' && l.status === 'Ready')],

  { t: 'Rota: booking type, absentees, extended hours', d: 'Session (4 h 10 m) vs Hourly; absent staff are blocked; weekend slots.', steps: [

    ['Try to assign Keira on Thursday: she’s on leave, so it’s blocked', 'pm', 'rota', null, () => false],
    ['Assign Lewis a Session on Saturday (extended hours); the end time sets itself', 'pm', 'rota', null, () => S.shifts.some(x => x.staffId === 's-lw' && new Date(x.start).getDay() === 6)]] },
  { t: 'Locum: compliance gate and eGP Hub', d: 'An expired certificate stops bidding; eGP Hub renews it automatically.', steps: [
    ['Practice manager sees Dr Feld’s booked shifts in red on the rota', 'pm', 'rota', null, () => false],

    ['Dr Feld: My Documents → Fetch from eGP Hub (verified automatically)', 'locum', 'documents', null, () => gaps('s-mf').length === 0],
    ['Dr Feld bids for the Saturday extended-hours slot', 'locum', 'myrota/open', null, () => S.shifts.some(x => x.bids.some(b => b.staffId === 's-mf'))],
    ['Practice manager accepts the bid in Shift Bidding', 'pm', 'rota/bidding', null, () => S.shifts.some(x => x.bids.some(b => b.staffId === 's-mf' && b.state === 'won'))]] },
  { t: 'Locum: direct offers', d: 'Manager sends a named offer; it expires if not answered.', steps: [
    ['Dr Feld accepts or rejects the Mon 23/11 offer', 'locum', 'myrota/offers', null, () => S.shifts.some(x => x.id === 'off-1' && x.offer.state !== 'offered')],
    ['Practice manager sends a new offer from an empty day on Dr Feld’s rota row', 'pm', 'rota', null, () => S.shifts.filter(x => x.offer && x.offer.staffId === 's-mf').length > 1]] },
  { t: 'Locum: unavailability', d: 'Free time saves straight away; time over a booked shift is a request.', steps: [
    ['Dr Feld adds unavailability on Fri 20/11 morning (over his Hub shift)', 'locum', 'unavail', null, () => S.unavail.some(u => u.shiftId)],
    ['Practice manager approves it: the shift is released and re-opened', 'pm', 'rota/requests', null, () => S.unavail.some(u => u.shiftId && u.status !== 'pending')]] },
  { t: 'Locum: activity, validation and pay', d: 'Ops Manager validates each line; the locum sees the status.', steps: [
    ['Ops Manager: approve one line, disapprove Dr Feld’s late start, adjust Dr Okonjo’s hours', 'ops', 'validation', null, () => S.activity.some(a => a.status === 'disapproved' || a.status === 'sent')],
    ['Dr Feld replies to the disapproval in My Activity', 'locum', 'activity', null, () => S.activity.some(a => a.replied)],
    ['Dr Feld checks My Earnings', 'locum', 'earnings', null, () => false]] },
  { t: 'Staff type and rates', d: 'Staff type locks after a shift; rates per duty type with history.', steps: [
    ['Practice manager: Staff → Dr Marcus Feld → Account Details (type locked)', 'pm', 'staff/s-mf/account', null, () => false],
    ['Rates → Add Rate (validation: pounds, date today or later)', 'pm', 'staff/s-mf/rates', null, () => ST('s-mf').rateHistory.length > 1]] },
];
function flowsPanel() {
  return drawer('Flows', 'Each step switches you to the right person and page. Steps tick when done.', (window.LOCUM_FLOWS || FLOWS).map((f, i) => `<div class="card pad" style="display:grid;gap:8px"><b>${i + 1}. ${f.t}</b><span class="sub">${f.d}</span>${f.steps.map(([txt, role, r, pid, done], j) => `<button class="item" style="cursor:pointer;text-align:left;padding:10px 12px" data-act="flowGo" data-f="${i}" data-s="${j}"><span class="ic ${done() ? 'ok' : 'grey'}" style="width:28px;height:28px">${done() ? I.check : j + 1}</span><span class="grow" style="font-size:13px">${esc(txt)}<span class="sub">${role === 'patient' ? 'Patient · ' + esc(P(pid).name) : ROLES[role].title}</span></span>${I.chev}</button>`).join('')}</div>`).join(''), `<button class="btn" data-act="closeModal">Close</button>`);
}
ACT.flowGo = d => { const [, role, r, pid] = (window.LOCUM_FLOWS || FLOWS)[d.f].steps[d.s]; U.flows = false; go(r, role, pid); return 'noRender'; };

/* ================= Shells ================= */
function chromeBar() {
  const roles = window.NO_LOCUM ? [['cn', 'Care Navigator'], ['gp', 'GP'], ['pm', 'Practice Manager'], ['patient', 'Patient']] : window.LOCUM_MODE ? [['locum', 'Locum GP'], ['pm', 'Practice Manager'], ['ops', 'Ops Manager']] : [['cn', 'Care Navigator'], ['gp', 'GP'], ['pm', 'Practice Manager'], ['ops', 'Ops Manager'], ['locum', 'Locum GP'], ['patient', 'Patient']];
  return `<div class="chrome" role="banner"><b class="t">${window.LOCUM_MODE ? 'Aqlios · Locum staff prototype (Phase 8)' : 'Aqlios · Sprint 16 prototype'}</b><div class="grp"><span class="lbl">View as</span>${roles.map(([k, l]) => `<button aria-pressed="${U.role === k}" data-act="role" data-v="${k}">${l}</button>`).join('')}${U.role === 'patient' ? `<select aria-label="Choose patient" data-act="pickPatient">${['p1', 'p3', 'p4', 'p2', 'p6', 'p7', 'p5', 'p11'].map(id => `<option value="${id}" ${U.pid === id ? 'selected' : ''}>${esc(P(id).name)}</option>`).join('')}</select>` : ''}</div><span class="sp"></span><div class="grp"><span class="clock" title="Demo clock">${I.clock.replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} ${fLong(S.now)}</span><button data-act="adv" data-v="1">+1 h</button><button data-act="adv" data-v="2">+2 h</button><button data-act="adv" data-v="24">+1 day</button><button data-act="flows" aria-pressed="${U.flows}">${I.flow.replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} Flows</button><button data-act="reset">Reset Demo</button></div></div>`;
}
function crmShell(content) {
  const r = route(); const top = r.split('/')[0]; const role = ROLES[U.role];
  const crumbLabel = { dashboard: 'Dashboard', patients: 'Patients', patient: 'Patients', consults: 'Consultations', consult: 'Consultations', appt: 'Appointment', letters: 'Letter Requests', results: 'Test Results', homevisits: 'Home Visits', staff: 'Staff', rota: 'ROTA Management', settings: 'Practice Settings', validation: 'Workforce Validation', myrota: 'My Rota', unavail: 'Unavailability', activity: 'My Activity', earnings: 'My Earnings', documents: 'My Documents', notifications: 'Notifications' }[top] || '';
  const counts = { appt: S.slots.filter(s => (U.role === 'cn' && s.status === 'needs') || (U.role === 'pm' && s.status === 'pending_pm')).length, results: U.role === 'gp' ? S.results.filter(x => x.status === 'awaiting').length : 0, rota: U.role === 'pm' && !window.NO_LOCUM ? S.unavail.filter(u => u.status === 'pending').length + S.shifts.filter(x => x.status === 'open' && x.bids.some(b => b.state === 'placed')).length : 0, validation: S.activity.filter(a => a.status === 'pending').length, letters: S.letters.filter(l => l.status === 'Sent').length, documents: gaps('s-mf').length, homevisits: U.role === 'gp' ? S.consults.filter(c => c.homeVisit && !c.hvId).length : 0 };
  const nav = MENU[U.role].map(([l, k, i]) => !k ? `<div class="sec">${l}</div>` : `<a href="#" data-act="go" data-r="${k}" class="${top === k || (k === 'patients' && top === 'patient') || (k === 'consults' && top === 'consult') ? 'on' : ''}" ${top === k ? 'aria-current="page"' : ''}>${I[i]}${l}${counts[k] ? `<span class="cnt">${counts[k]}</span>` : ''}</a>`).join('') + `<div style="border-top:1px solid var(--line);margin:10px 6px"></div><a href="#" data-act="go" data-r="notifications" class="${top === 'notifications' ? 'on' : ''}">${I.bell}Notifications</a>`;
  const unread = myNotifs().filter(n => !n.read).length;
  return `<div class="app"><header class="top"><div class="crumbs">Dashboard${crumbLabel && crumbLabel !== 'Dashboard' ? ` › <b>${crumbLabel}</b>` : ''}</div><div class="search">${I.search} Search patients, staff or pages…</div><div style="position:relative"><button class="iconbtn" aria-label="Notifications" aria-expanded="${U.dd}" data-act="dd">${I.bell}${unread ? `<span class="badge">${unread}</span>` : ''}</button>${U.dd ? `<div class="dd" role="menu" aria-label="Notifications"><div class="between" style="padding:6px 10px"><b>Notifications</b><button class="btn sm ghost" data-act="readAll">Mark all as read</button></div>${myNotifs().slice(0, 8).map(n => `<button class="n ${n.read ? '' : 'new'}" data-act="openN" data-id="${n.id}"><span class="ic" style="width:32px;height:32px">${I.bell}</span><span><b style="font-weight:500">${esc(n.title)}</b><small>${esc(n.body)}</small><small>${fDT(n.at)}</small></span></button>`).join('') || '<div class="empty">No notifications.</div>'}<button class="btn sm ghost" style="width:100%" data-act="go" data-r="notifications">View all</button></div>` : ''}</div><div class="who"><span class="av">${initials(role.name)}</span><span><span class="n">${esc(role.name)}</span><span class="p"><i>●</i>Ashford Medical Centre · ${role.title}</span></span></div></header>
  <div class="layout"><aside class="side"><div class="logo">aqlios <small>Public<br>Practice</small></div><nav aria-label="Main navigation">${nav}</nav><div class="me"><span class="av">${initials(role.name)}</span><div><b style="font-weight:600;font-size:13px">${esc(role.name)}</b><small>${role.title}</small></div></div></aside><main class="main">${content}</main></div></div>`;
}

/* ================= Render ================= */
function pageHtml() {
  const parts = route().split('/');
  if (U.role === 'patient') { const f = PP[parts[0]] || PP.home; return patientShell(f(parts)); }
  const allowed = MENU[U.role].map(m => m[1]).filter(Boolean).concat(['notifications', 'patient', 'consult', 'staff']);
  if (!allowed.includes(parts[0]) || !PAGES[parts[0]]) return crmShell(`<div class="empty" style="padding:60px 20px"><h1 style="font-size:22px;color:var(--ink)">You don’t have access to this page</h1><p>Your role doesn’t include it. Ask your practice manager if you think you need it.</p><button class="btn brand" data-act="go" data-r="dashboard">Go to Dashboard</button></div>`);
  return crmShell(PAGES[parts[0]](parts));
}
function render() {
  const root = document.getElementById('app');
  const keep = {};
  if (U.preserve) document.querySelectorAll('.modal [id], .drawer [id], .main [id], .pmain [id]').forEach(el => { if ('value' in el && el.type !== 'file') keep[el.id] = el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value; });
  let html;
  try { html = chromeBar() + pageHtml(); } catch (e) { console.error(e); html = chromeBar() + `<div class="app"><div class="main"><h1>Something went wrong</h1><p class="sub">${esc(e.message)}</p><button class="btn brand" data-act="reset">Reset Demo</button></div></div>`; }
  if (U.modal) { const [m, id] = U.modal; try { html += MODALS[m](id); } catch (e) { console.error(e); U.modal = null; } }
  if (U.drawer) { const [d, id] = U.drawer; try { html += DRAWERS[d](id); } catch (e) { console.error(e); U.drawer = null; } }
  if (U.flows) html += flowsPanel();
  if (U.toast) html += `<div class="toast ${U.toast.tone}" role="status">${U.toast.tone === 'err' ? I.alert : I.check}${esc(U.toast.text)}</div>`;
  root.innerHTML = html;
  if (U.preserve) { Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && 'value' in el && el.type !== 'file') { if (typeof v === 'boolean') el.checked = v; else el.value = v; } }); U.preserve = false; }
  const f = document.querySelector('.modal input, .modal select, .modal textarea, .drawer .db button'); if (f && U.focusModal) { f.focus(); U.focusModal = false; }
}

/* ================= Events ================= */
const CORE = {
  go: d => { go(d.r); return 'noRender'; },
  role: d => { U.role = d.v; U.dd = false; U.modal = null; U.drawer = null; U.gh = null; U.err = null; save(); },
  pickPatient: () => 'noRender',
  adv: d => { advance(Number(d.v) * HOUR); return 'noRender'; },
  flows: () => { U.flows = !U.flows; U.modal = null; U.drawer = null; },
  reset: () => { if (!confirm('Reset the demo? All changes go back to the start.')) return 'noRender'; S = seed(); U.route = {}; U.filt = {}; U.week = 0; U.gh = null; U.modal = null; U.drawer = null; U.flows = false; save(); toast('Demo reset'); },
  dd: () => { U.dd = !U.dd; },
  modal: d => { U.err = null; U.unWarn = null; U.hk = null; U.modal = [d.m, d.id]; U.drawer = null; U.focusModal = true; },
  drawer: d => { U.err = null; U.drawer = [d.d, d.id]; U.modal = null; },
  closeModal: (d, el, ev) => { if (d.self && ev.target !== el) return 'noRender'; U.modal = null; U.drawer = null; U.flows = false; U.err = null; U.unWarn = null; U.hk = null; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (U.dd && !ev.target.closest('.dd')) { U.dd = false; render(); } return; }
  const act = el.dataset.act;
  if (['filter', 'search', 'pickPatient', 'bookingType'].includes(act)) return;
  if (el.tagName === 'A') ev.preventDefault();
  const fn = CORE[act] || ACT[act]; if (!fn) return;
  if (act !== 'dd' && act !== 'openN' && act !== 'readAll') U.dd = false;
  const res = fn({ ...el.dataset }, el, ev);
  if (res === 'noRender') return;
  if (U.err) U.preserve = true;
  tick(); save(); render();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.act === 'filter') { U.filt[el.dataset.k] = el.value; save(); render(); }
  if (el.dataset.act === 'pickPatient') { U.pid = el.value; U.gh = null; U.route.patient = 'home'; save(); render(); }
  if (el.dataset.act === 'bookingType') ACT.bookingType();
  if (el.id === 'asS') ACT.bookingType();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.act === 'search') { U.filt[el.id] = el.value; clearTimeout(render.t); render.t = setTimeout(() => { render(); const s = document.getElementById(el.id); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); }
  if (el.dataset.counter) { const c = document.getElementById(el.dataset.counter); if (c) c.textContent = `${el.value.length} / 250`; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (U.modal || U.drawer || U.flows || U.dd)) { U.modal = null; U.drawer = null; U.flows = false; U.dd = false; render(); } });
tick(); render();


/* ---------- Sprint 16 without the locum and Ops Manager modules ---------- */
if (window.NO_LOCUM) {
  MENU.pm = [['OVERVIEW'], ['Dashboard', 'dashboard', 'grid'], ['EHR'], ['Patients', 'patients', 'users'], ['Appointment', 'appt', 'cal'], ['Home Visits', 'homevisits', 'home'], ['HRM'], ['ROTA Management', 'rota', 'cal'], ['SETTINGS'], ['Practice Settings', 'settings', 'settings']];
  delete MENU.ops; delete MENU.locum;
  if (!['cn', 'gp', 'pm', 'patient'].includes(U.role)) U.role = 'cn';
  S.notifs = S.notifs.filter(n => !['locum', 'ops'].includes(n.to) && !/locum/i.test(n.title + n.body));
  FLOWS.splice(10);
  FLOWS[9] = { t: 'Rota: booking type, absentees, extended hours', d: 'Session (4 h 10 m) or Hourly shifts; absent staff are blocked; weekend extended hours.', steps: [
    ['Try to assign Keira on Thursday: she’s on leave, so the day is blocked', 'pm', 'rota', null, () => false],
    ['Assign Lewis a Session on Saturday (extended hours); the end time sets itself', 'pm', 'rota', null, () => S.shifts.some(x => x.staffId === 's-lw' && new Date(x.start).getDay() === 6)],
    ['Assign an Hourly shift and set the end time yourself', 'pm', 'rota', null, () => S.shifts.some(x => x.staffId && !String(x.id).match(/^(hw|lw|km|mf|lo)-/) && x.booking === 'hourly')]] };
  const dash0 = PAGES.dashboard;
  PAGES.dashboard = parts => {
    if (U.role !== 'pm') return dash0(parts);
    const cards = dcard('p', 'clock', 'Offers Awaiting Approval', S.slots.filter(s => s.status === 'pending_pm').length, 'appt/cancelled') + dcard('g', 'check', 'Slots Refilled', S.slots.filter(s => s.status === 'booked').length, 'appt/cancelled') + dcard('o', 'cal', 'Slots Released', S.slots.length, 'appt/cancelled') + dcard('r', 'alert', 'Frequent Cancellers', S.patients.filter(p => cancelCount(p.id) >= S.settings.errAt).length, 'patients') + dcard('t', 'home', 'Home Visits Booked', S.homeVisits.filter(h => h.status === 'Booked').length, 'homevisits');
    return ph('Welcome, Nadia', 'Ashford Medical Centre') + `<div class="kpis">${cards}</div><h2 class="sh">Latest notifications</h2><div class="list">${myNotifs().slice(0, 5).map(nItem).join('') || '<div class="sub">No notifications.</div>'}</div>`;
  };
  save(); render();
}
